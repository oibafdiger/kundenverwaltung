[project]
name = "kundenverwaltung"
version = "0.3.0"
description = "Objektorientierte Kundenverwaltung in Python — Komposition, Protokolle, Fehlerhierarchie, transaktionale Persistenz in JSON oder SQLite"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# schema.sql gehoert zum Paket: SQLiteSpeicher liest es zur Laufzeit neben
# sich ein. Ohne diese Angabe nimmt setuptools nur .py-Dateien mit.
[tool.setuptools.package-data]
kundenverwaltung = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "langsam: startet einen eigenen Python-Prozess (Importzyklus, mypy)",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
