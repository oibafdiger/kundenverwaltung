[project]
name = "kundenverwaltung"
version = "0.2.0"
description = "Objektorientierte Kundenverwaltung in Python — Komposition, Protokolle, Fehlerhierarchie, transaktionale JSON-Persistenz"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]
